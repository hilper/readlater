<style>
/* Layout idea: ink on paper. No cards, only hairlines; the light serif days-left numeral carries each row, and vermilion appears only on what is about to die. */
:root{
  --bg:#F5F5F2; --ink:#161616; --muted:#5F5F5B; --line:#D4D4CF; --red:#B3261E; --on-ink:#F5F5F2;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121211; --ink:#ECECE7; --muted:#A5A59F; --line:#34342F; --red:#EC6F63; --on-ink:#121211; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#121211; --ink:#ECECE7; --muted:#A5A59F; --line:#34342F; --red:#EC6F63; --on-ink:#121211; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}

header{padding:calc(22px + env(safe-area-inset-top)) 28px 0;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-weight:600;font-size:28px;margin:0;letter-spacing:.12em}
.sub,.k{font-size:12px;color:var(--muted);letter-spacing:.08em}
.slots{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--ink);padding:10px 0 0}
.dots{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.dot{width:9px;height:9px;border:1px solid var(--ink)}
.dot.on{background:var(--ink)}
.dots .n{font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}
.xp{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:10px}
.bar{flex:1;height:1px;background:var(--line)}
.bar i{display:block;height:1px;background:var(--ink)}

main{flex:1;overflow-y:auto;padding:0 28px 150px;display:flex;flex-direction:column}
.demo{border:1px solid var(--ink);padding:12px 14px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:13px}
.lead{font-size:13px;color:var(--muted);margin:6px 0 0}
h2{font-size:20px;margin:22px 0 0;font-weight:600;letter-spacing:.04em;text-wrap:balance}

.card{--tone:var(--ink);display:grid;grid-template-columns:76px 1fr;column-gap:14px;row-gap:6px;padding:18px 0 8px;border-bottom:1px solid var(--line)}
.card.warn{--tone:var(--muted)}
.card.dying{--tone:var(--red)}
.left{grid-row:1 / span 3;display:flex;flex-direction:column;align-items:flex-start;gap:2px;color:var(--tone)}
.left b{font-size:64px;font-weight:300;line-height:.95;font-variant-numeric:tabular-nums}
.left span{font-size:11px;letter-spacing:.1em;white-space:nowrap}
.title{font-size:18px;line-height:1.4;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.life{grid-column:2;height:1px;background:var(--line);margin-top:2px}
.life i{display:block;height:1px;background:var(--tone)}
.acts{grid-column:2;display:flex;gap:18px;align-items:center}
.btn{border:1px solid var(--ink);background:transparent;padding:8px 16px;font-size:14px;letter-spacing:.06em;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;min-height:44px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5}
.acts .btn{border:0;padding:0;background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:4px;letter-spacing:0}
.acts .btn.primary{font-weight:600}
.acts .btn.ghost{text-decoration:none;color:var(--muted);font-size:13px;margin-left:auto}
.slot{padding:22px 0;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line)}

.tomb{padding:16px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.tomb .title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.note{padding:20px 0 16px;border-bottom:1px solid var(--line)}
.note q{font-size:20px;line-height:1.6;quotes:"「" "」";display:block;overflow-wrap:anywhere}
.note a{color:var(--muted);text-underline-offset:3px;overflow-wrap:anywhere}

.panel{display:flex;flex-direction:column;gap:10px;padding:0 0 22px;border-bottom:1px solid var(--line)}
.panel > .lead:first-child{margin-top:22px}

th,td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}

th:last-child,td:last-child{padding-right:0}
th{font-weight:400;color:var(--muted);font-size:12px;letter-spacing:.06em}

.badge{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.badge b{display:block;font-size:16px;font-weight:400}
.badge.got{color:var(--ink)}
.badge.got b{font-weight:600}
.rules{margin:0;padding-left:18px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
textarea,input[type=text],input[type=url],input[type=password]{width:100%;border:0;border-bottom:1px solid var(--ink);background:transparent;padding:8px 0;font-size:17px}
textarea{min-height:92px;resize:vertical;border:1px solid var(--line);padding:10px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}

.fab{position:fixed;left:50%;transform:translateX(-50%);width:min(464px,calc(100% - 56px));bottom:calc(66px + env(safe-area-inset-bottom));min-height:48px;background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);font-size:15px;letter-spacing:.1em}
.fab.full{background:var(--bg);color:var(--muted);border-color:var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink)}
nav a{min-height:52px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:14px;letter-spacing:.1em}
nav a[aria-current="page"]{color:var(--ink);font-weight:600}

#sheet{position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheet[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;border-top:1px solid var(--ink);padding:24px 28px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet h3{font-size:22px;font-weight:600;margin:0;letter-spacing:.08em}
.sheet p{margin:0}
.sheet form{display:flex;flex-direction:column;gap:14px}
.sheet label,.sheet legend{font-size:12px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:4px;padding:0}
fieldset{border:0;margin:0;padding:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0}
.seg label{margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:44px;text-align:center;border:1px solid var(--ink);margin-left:-1px;font-size:13px;color:var(--ink)}
.seg label:first-child span{margin-left:0}
.seg input:checked + span{background:var(--ink);color:var(--on-ink)}
.seg input:focus-visible + span{outline:2px solid var(--ink);outline-offset:3px}
.seg input:disabled + span{opacity:.55}
#add-pdf{max-width:100%;font:inherit;font-size:13px;color:var(--muted)}
.pdf-pick{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pdf-pick label{margin:0}
.pdf-pick .btn[hidden]{display:none}
.err{color:var(--red);font-size:13px;min-height:1.2em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:var(--on-ink);padding:10px 18px;font-size:14px;letter-spacing:.04em;z-index:20;transition:transform .25s,opacity .25s;max-width:88%;text-align:center;opacity:0;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.reader{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
#app[hidden],.reader[hidden],.reader-bar[hidden],.reader-bottom .btn[hidden]{display:none}
.reader-bar{display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.reader-top{justify-content:space-between;border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top))}
.reader-site{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.reader-bottom{justify-content:flex-end;border-top:1px solid var(--line);padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.reader-frame{flex:1;width:100%;min-height:0;border:0}
.reader-status{flex:1;margin:0;padding:22px 16px;text-align:center;color:var(--muted)}
.reader-zoom{display:flex;gap:4px;flex:none}
.reader-zoom .btn{padding-inline:10px}
.pdf-scroll{flex:1;min-height:0;width:100%;max-width:920px;align-self:center;overflow:auto;overflow-anchor:none}
.pdf-pages{position:relative;display:flex;flex-direction:column;gap:10px;min-width:100%;padding:10px}
.pdf-page{flex:none;width:100%;overflow:hidden;background:#fff;outline:1px solid var(--line)}
.pdf-page canvas{display:block;width:100%;height:100%}
.pdf-page-error{color:#444}
</style>

<div id="app">
  <header id="head"></header>
  <main id="view"><p class="lead">載入中…</p></main>
</div>
<button class="fab" id="fab" type="button" data-act="open-add">存入一篇</button>

<div id="sheet" hidden></div>

<script>
var hasRendered = false, startupErrorShown = false;

window.addEventListener("error", showStartupError);
window.addEventListener("unhandledrejection", showStartupError);

function showStartupError(event){
  if(hasRendered || startupErrorShown) return;
  startupErrorShown = true;

  var message = "未知錯誤";
  if(event.type === "unhandledrejection"){
    var reason = event.reason;
    try{
      message = reason && typeof reason.message === "string" ? reason.message : String(reason);
    }catch(error){}
  }else{
    message = event.message || message;
    if(event.filename || event.lineno || event.colno){
      message += " (" + event.filename + ":" + event.lineno + ":" + event.colno + ")";
    }
  }

  var view = document.getElementById("view");
  var heading = document.createElement("p");
  heading.className = "lead";
  heading.textContent = "載入出錯，請截圖給 Claude：";
  var detail = document.createElement("p");
  detail.style.overflowWrap = "break-word";
  detail.textContent = message;
  var reload = document.createElement("button");
  reload.className = "btn";
  reload.type = "button";
  reload.textContent = "重新載入";
  reload.addEventListener("click", function(){location.reload();});

  view.textContent = "";
  view.appendChild(heading);
  view.appendChild(detail);
  view.appendChild(reload);
  document.getElementById("reader").hidden = true;
  document.getElementById("app").hidden = false;
}
</script>

  if(error.code === "weak_password" || /password.*(short|at least)/i.test(message)) return "密碼太短（至少 6 字）。";

function active(){return state.items.filter(function(i){return i.status === "active";}).sort(function(a,b){return a.expiresAt - b.expiresAt;});}
function dead(){return state.items.filter(function(i){return i.status === "expired" || i.status === "dropped";}).sort(function(a,b){return b.endedAt - a.endedAt;});}
function done(){return state.items.filter(function(i){return i.status === "read";}).sort(function(a,b){return b.endedAt - a.endedAt;});}
function weekly(){
  var cur = weekIdx(Date.now()), rows = [];
  for(var w = cur; w > cur - 4; w--) rows.push({w:w, saved:0, read:0, expired:0, dropped:0});
  state.items.forEach(function(it){
    var s = cur - weekIdx(it.savedAt); if(s >= 0 && s < 4) rows[s].saved++;

  if(sync && (lastExtractRequestAt === null || now - lastExtractRequestAt >= 4 * 60 * 1000)){
    lastExtractRequestAt = now;
    try{client.functions.invoke("extract", {body:{warm:true}}).catch(function(){});}
    catch(error){}
  }
}
function isExtracting(draft, url){
  if(!sync || draft.account !== sync || !url || draft.url !== url || draft.article !== undefined) return false;
  try{return Boolean(new URL(url).hostname);}catch(error){return false;}
}
function extractStatus(draft, message){
  var hint = draft.form.querySelector("#add-extract");
  var title = draft.form.querySelector("#add-title");
  var canSaveWithoutTitle = isExtracting(draft, draft.url);
  hint.hidden = !message;
  hint.textContent = canSaveWithoutTitle ? "正在抓正文… 可以直接存入" : message;
  if(canSaveWithoutTitle) title.placeholder = "留空會自動用文章標題";
  else title.removeAttribute("placeholder");
}
function setAutoSize(draft, size){
  if(draft.manualSize || !size) return;
  draft.form.querySelector("#add-size-" + size).checked = true;
  draft.form.querySelector("#add-size-label").textContent = "篇幅 · 自動判斷";
  draft.autoSize = true;
}
function clearAutoSize(draft){
  if(!draft.autoSize) return;
  draft.form.querySelector("#add-size-m").checked = true;
  draft.form.querySelector("#add-size-label").textContent = "篇幅";
  draft.autoSize = false;
}
function extractForUrl(draft, url){
  var account = sync;
  if(draft.url === url && draft.account === account) return;
  draft.url = url;
  draft.account = account;
  draft.article = undefined;
  var sequence = ++draft.sequence;
  clearTimeout(draft.timer);
  var title = draft.form.querySelector("#add-title");
  if(title.value === draft.autoTitle) title.value = "";
  draft.autoTitle = undefined;
  clearAutoSize(draft);
  extractStatus(draft, account && url ? "正在抓正文…" : "");
  if(!account || !url) return;
  draft.timer = setTimeout(function(){
    // Writes for the same item must finish in URL order.
    draft.request = Promise.resolve(draft.request).then(function(){
      return runExtract(draft, url, sequence, account);
    });
  }, 400);
}
async function runExtract(draft, url, sequence, account){
  await articleCleanups.get(account);
  var itemId = draft.pendingId;
  if(sync !== account || draft.sequence !== sequence || (!draft.form.isConnected && !find(itemId))) return;
  var data, request;
  try{
    lastExtractRequestAt = Date.now();
    request = client.functions.invoke("extract", {body:{url, itemId}});
    activeExtracts.set(request, account);
    var result = await request;
    if(!result.error && result.data && result.data.ok === true) data = result.data;
  }catch(error){}
  finally{activeExtracts.delete(request);}
  if(sync !== account || draft.sequence !== sequence) return;
  draft.article = data ? "ok" : "failed";
  var extractedSize = data && ["s", "m", "l"].includes(data.size) ? data.size : null;
  var it = find(itemId);
  if(it && it.url === url && (it.status === "active" || it.status === "read")){
    it.article = draft.article;
    if(it.status === "active"){
      if(it.autoTitle === true){
        var extractedTitle = data && String(data.title || "").trim();
        if(extractedTitle) it.title = extractedTitle.slice(0, 80);
        delete it.autoTitle;
      }
      if(!it.manualSize && extractedSize) it.size = extractedSize;
    }
    commit();
  }
  if(!draft.form.isConnected) return;
  extractStatus(draft, data ? "已抓到正文 · 約 " + data.minutes + " 分鐘" : "抓不到正文，存入後會跳轉原網址閱讀");
  if(!data) return;
  var title = draft.form.querySelector("#add-title");
  if(!title.value.trim()){
    draft.autoTitle = String(data.title || "").slice(0, 80);
    title.value = draft.autoTitle;
  }
  setAutoSize(draft, extractedSize);
}
function deleteArticles(account){
  articleCache.delete(account);
  // Let in-flight writes finish before the delete. New writes wait for cleanup.
  var outstanding = Array.from(activeExtracts).filter(function(entry){return entry[1] === account;})
    .map(function(entry){return entry[0];});
  var previous = articleCleanups.get(account);
  if(previous) outstanding.push(previous);
  var cleanup = Promise.allSettled(outstanding).then(async function(){
    if(sync !== account) return;
    try{await client.from("readlater_articles").delete().eq("user_id", account.user.id);}
    catch(error){}
  });
  articleCleanups.set(account, cleanup);
}
function parseUrlField(){
  var raw = document.getElementById("add-url").value, m = raw.match(/https?:\/\/[^\s]+/i);
  var titleEl = document.getElementById("add-title");
  extractForUrl(pendingAdd, m ? m[0] : null);
  if(m){
    var rest = raw.replace(m[0], "").replace(/\s+/g, " ").trim();
    if(rest && !titleEl.value) titleEl.value = rest.slice(0, 80);
    document.getElementById("add-plat").textContent = "識別為：" + platform(m[0]);
  } else document.getElementById("add-plat").innerHTML = "&nbsp;";
  return m ? m[0] : null;
}
function cancelPdfCheck(draft){
  draft.pdfCheck = null;
  destroyPdf(draft.pdfTask);
  draft.pdfTask = null;
}
function updatePdfPicker(draft){
  var form = draft.form, uploading = pdfUploads.has(draft);
  form.querySelector("#add-pdf").disabled = !sync || uploading;
  form.querySelector("#add-pdf-login").hidden = Boolean(sync);
  var clear = form.querySelector('[data-act="clear-pdf"]');
  clear.hidden = !draft.pdfFile;
  clear.disabled = uploading;
}
function updatePdfSelection(draft, file){
  var form = draft.form, url = form.querySelector("#add-url");
  var title = form.querySelector("#add-title"), video = form.querySelector("#add-type-v");
  if(draft.pdfFile){
    if(title.value === draft.autoTitle) title.value = "";
    draft.autoTitle = undefined;
    clearAutoSize(draft);
  }
  if(file){
    extractForUrl(draft, null);
    extractStatus(draft, "");
    url.value = "";
    form.querySelector("#add-plat").textContent = "識別為：PDF";
    if(!draft.pdfFile) draft.wasVideo = video.checked;
    form.querySelector("#add-type-a").checked = true;
    if(!title.value.trim()){
      draft.autoTitle = file.name.replace(/\.pdf$/i, "").slice(0, 80);
      title.value = draft.autoTitle;
    }
  }else if(draft.pdfFile){
    form.querySelector("#add-plat").innerHTML = "&nbsp;";
    if(draft.wasVideo) video.checked = true;
  }
  url.disabled = video.disabled = Boolean(file);
  if(Boolean(draft.pdfFile) !== Boolean(file)){
    var labels = file ? ["短 · 8 頁內", "中 · 9–30 頁", "長 · 31 頁以上"]
      : ["短 · 10 分鐘內", "中 · 10–30", "長 · 30 以上"];
    form.querySelectorAll('input[name="size"] + span').forEach(function(label, i){label.textContent = labels[i];});
  }
  draft.pdfFile = file;
  draft.pdfPages = null;
  updatePdfPicker(draft);
}
async function selectPdf(draft, input){
  if(!sync || pdfUploads.has(draft)) return;
  var file = input.files[0], err = draft.form.querySelector("#add-err");
  var button = draft.form.querySelector('[type="submit"]');
  cancelPdfCheck(draft);
  err.textContent = "";
  button.disabled = false;
  if(file && !/\.pdf$/i.test(file.name) && file.type !== "application/pdf") err.textContent = "請選擇 PDF 檔案。";
  else if(file && file.size > 50 * 1024 * 1024) err.textContent = "PDF 不能超過 50 MB。";
  if(err.textContent){
    input.value = "";
    file = null;
  }
  updatePdfSelection(draft, file);
  if(!file) return;
  var check = {}, account = sync;
  draft.pdfCheck = check;
  button.disabled = true;
  function current(){return pendingAdd === draft && draft.pdfCheck === check && sync === account;}
  try{
    var results = await Promise.all([loadPdfJs(), file.arrayBuffer()]);
    if(!current()) return;
    draft.pdfTask = openPdf(results[0], results[1]);
    var pdf = await draft.pdfTask.promise;
    if(!current()) return;
    if(!pdf.numPages) throw new Error("PDF has no pages");
    draft.pdfPages = pdf.numPages;
    setAutoSize(draft, pdf.numPages <= 8 ? "s" : pdf.numPages <= 30 ? "m" : "l");
  }catch(error){
    if(!current()) return;
    err.textContent = "這個 PDF 打不開";
    input.value = "";
    updatePdfSelection(draft, null);
  }finally{
    if(current()){
      cancelPdfCheck(draft);
      button.disabled = false;
    }
  }
}
function addSlotFull(){
  var used = active().length;
  pdfUploads.forEach(function(request, draft){
    if(draft.uploadAccount === sync && draft.uploadCleanup === pdfCleanups.get(sync)) used++;
  });
  return used >= slotCap(state.xp);
}
function addItem(draft, fields){
  var now = Date.now();
  var item = Object.assign({
    id:draft.pendingId, size:draft.form.querySelector("input[name=size]:checked").value,
    savedAt:now, expiresAt:now + LIFE*DAY, status:"active", pos:0, posAt:0
  }, fields);
  if(draft.manualSize) item.manualSize = true;
  return item;
}
function saveAddedItem(draft, item){
  state.items.push(item);
  if(pendingAdd === draft) closeSheet();
  commit();
  toast("已存入，" + LIFE + " 天後枯萎");
}
async function submitPdf(draft, title, err){
  if(!sync || !draft.pdfPages || pdfUploads.has(draft)) return;
  if(!title){err.textContent = "請填一個標題。"; return;}
  if(addSlotFull()){err.textContent = "收藏位已滿，先讀完一篇。"; return;}
  var account = sync, cleanup = pdfCleanups.get(account), file = draft.pdfFile;
  var path = pdfPath(account, draft.pendingId);
  var item = addItem(draft, {url:"", title:title, type:"article", platform:"PDF", article:"ok",
    pdf:{path:path, name:file.name, bytes:file.size, pages:draft.pdfPages}});
  var button = draft.form.querySelector('[type="submit"]');
  var label = button.textContent;
  err.textContent = "";
  button.disabled = true;
  button.textContent = "上傳中…";
  draft.uploadAccount = account;
  draft.uploadCleanup = cleanup;
  var request = Promise.resolve(cleanup).then(function(){
    if(sync !== account || pdfCleanups.get(account) !== cleanup) return null;
    if(active().length >= slotCap(state.xp)) return {full:true};
    // Supabase 會以 Blob 的 MIME 型別建立 multipart 檔案欄位。
    var body = file.type === "application/pdf" ? file : file.slice(0, file.size, "application/pdf");
    return pdfStorage().upload(path, body, {contentType:"application/pdf", upsert:true});
  });
  pdfUploads.set(draft, request);
  updatePdfPicker(draft);
  try{
    var result = await request;
    if(sync !== account || pdfCleanups.get(account) !== cleanup) return;
    if(result && result.full){
      if(pendingAdd === draft) err.textContent = "收藏位已滿，先讀完一篇。";
      return;
    }
    if(!result || result.error) throw new Error("upload");
    item.savedAt = Date.now();
    item.expiresAt = item.savedAt + LIFE*DAY;
    saveAddedItem(draft, item);
  }catch(error){
    if(pendingAdd === draft && sync === account) err.textContent = "上傳失敗，請再試一次";
  }finally{
    pdfUploads.delete(draft);
    if(pendingAdd === draft){
      updatePdfPicker(draft);
      button.disabled = false;
      button.textContent = label;
    }
  }
}
function submitAdd(){
  var draft = pendingAdd, err = document.getElementById("add-err");
  if(draft.pdfFile){submitPdf(draft, document.getElementById("add-title").value.trim(), err); return;}
  var url = parseUrlField(), title = document.getElementById("add-title").value.trim();
  if(!url){err.textContent = "沒有找到連結。請貼上以 http 開頭的網址。"; return;}
  if(!title && !isExtracting(draft, url)){err.textContent = "請填一個標題。"; return;}
  if(addSlotFull()){err.textContent = "收藏位已滿，先讀完一篇。"; return;}
  var item = addItem(draft, {url:url, title:title || fallbackTitle(url),
    type:draft.form.querySelector("input[name=type]:checked").value, platform:platform(url)});
  if(!title) item.autoTitle = true;
  if(draft.article) item.article = draft.article;
  saveAddedItem(draft, item);
}
function sheetRead(it){
  openSheet('<h3>讀完了</h3><p class="lead">' + esc(it.title) + '</p><form id="f-read" data-id="' + it.id + '" novalidate>' +
    '<div><label for="read-note">用一句話寫下收穫（至少 ' + MIN_NOTE + ' 個字）</label><textarea id="read-note" maxlength="300"></textarea></div>' +
    '<p class="err" id="read-err"></p>' +
    '<div class="row"><button class="btn primary" type="submit" style="flex:1">提交，獲得 ' + XP[it.size] + ' 分</button><button class="btn" type="button" data-act="close">取消</button></div></form>');
}
function submitRead(id){
  var it = find(id), note = document.getElementById("read-note").value.trim();
  if(!it || it.status !== "active"){closeSheet(); return;}
  if(note.length < MIN_NOTE){document.getElementById("read-err").textContent = "還差 " + (MIN_NOTE - note.length) + " 個字。"; return;}
  if(readerPage && readerPage.id === id) saveReaderProgress();
  var now = Date.now(), before = level(state.xp), wk = weekIdx(now);
  it.status = "read"; it.endedAt = now; it.takeaway = note;
  state.xp += XP[it.size];
  if(state.lastReadWeek !== wk){state.streak = state.lastReadWeek === wk - 1 ? state.streak + 1 : 1; state.lastReadWeek = wk;}
  if(state.streak > state.bestStreak) state.bestStreak = state.streak;
  closeSheet(); commit();
  if(tab() === "reader" && readerItem() === it) closeReader();
  toast(level(state.xp) > before ? "升到 Lv " + level(state.xp) + "，多了一個收藏位" : "+" + XP[it.size] + " 分，空出一個收藏位");
}
function sheetDrop(it){
  openSheet('<h3>放棄這一篇？</h3><p class="lead">' + esc(it.title) + '</p><p>它會進入墓地並永久留在那裡，不能復活。</p>' +
    '<div class="row"><button class="btn danger" type="button" data-act="confirm-drop" data-id="' + it.id + '" style="flex:1">放棄，送進墓地</button><button class="btn" type="button" data-act="close">再留一下</button></div>');
}
function sheetImport(){
  openSheet('<h3>貼上備份還原</h3><p class="lead">還原會覆蓋目前的全部資料。</p><div><label for="imp-text">備份文字</label><textarea id="imp-text"></textarea></div><p class="err" id="imp-err"></p>' +
    '<div class="row"><button class="btn primary" type="button" data-act="confirm-import" style="flex:1">覆蓋並還原</button><button class="btn" type="button" data-act="close">取消</button></div>');
}
function sheetReset(){
  openSheet('<h3>全部清空？</h3><p>書架、墓地、收穫、等級和連勝都會歸零，無法復原。</p>' +
    '<div class="row"><button class="btn danger" type="button" data-act="confirm-reset" style="flex:1">清空</button><button class="btn" type="button" data-act="close">取消</button></div>');
}
function sheetBackup(text){
  openSheet('<h3>備份文字</h3><p class="lead">無法自動複製。請長按下方文字，全選後複製，貼到備忘錄保存。</p><textarea id="bk-text" readonly>' + esc(text) + '</textarea><button class="btn wide" type="button" data-act="close">完成</button>');
}

function sheetSignOut(){
  openSheet('<h3>登出？</h3><p>登出後，這台裝置上的資料會清除，雲端資料保留，下次登入會回來。</p>' +
    '<div class="row"><button class="btn danger" type="button" data-act="confirm-signout">登出</button>' +
    '<button class="btn" type="button" data-act="close">取消</button></div>');
}

/* ---------- events ---------- */
document.addEventListener("click", function(e){
  if(e.target === sheetEl){closeSheet(); return;}
  var el = e.target.closest("[data-act]"); if(!el) return;
  var act = el.getAttribute("data-act"), id = el.getAttribute("data-id"), it = id ? find(id) : null;
  if(act === "open-add"){ if(addSlotFull()) toast("收藏位已滿，先讀完一篇才能再存"); else sheetAdd(); }
  else if(act === "clear-pdf" && pendingAdd){
    var input = pendingAdd.form.querySelector("#add-pdf");
    input.value = "";
    selectPdf(pendingAdd, input);
  }
  else if(act === "open-reader" && it){
    if(e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    openReader(it);
  }
  else if(act === "close-reader") closeReader();
  else if(act === "open-read" && it){
    if(tab() === "reader" && flushReaderProgress()) render();
    sheetRead(it);
  }
  else if(act === "open-drop" && it) sheetDrop(it);
  else if(act === "confirm-drop" && it && it.status === "active"){ it.status = "dropped"; it.endedAt = Date.now(); deletePdf(it); closeSheet(); commit(); toast("已送進墓地"); }
  else if(act === "close") closeSheet();
  else if(act === "start"){ demo = false; state = fresh(); commit(); location.hash = "shelf"; toast("示例已清空，存入你的第一篇吧"); }
  else if(act === "open-signout") sheetSignOut();
  else if(act === "confirm-signout") signOut();
  else if(act === "open-import") sheetImport();
  else if(act === "open-reset") sheetReset();
  else if(act === "confirm-reset"){
    bootExpiredPdfs = null;
    demo = false; state = fresh(); closeSheet(); commit(true); toast("已清空");
    if(sync){deleteArticles(sync); deleteAllPdfs(sync);}
  }
  else if(act === "copy-backup"){
    var text = JSON.stringify(state);
    try{ navigator.clipboard.writeText(text).then(function(){toast("備份文字已複製");}, function(){sheetBackup(text);}); }catch(err){ sheetBackup(text); }
  }
  else if(act === "confirm-import"){
    var errEl = document.getElementById("imp-err");
    try{
      var o = JSON.parse(document.getElementById("imp-text").value);
      if(!o || !Array.isArray(o.items) || typeof o.xp !== "number") throw new Error("shape");
      bootExpiredPdfs = null;
      bootExpiredPdfs = null;
      o.started = true; state = o; demo = false; settle(); closeSheet(); commit(true); toast("已還原");
    }catch(err){ errEl.textContent = "這段文字不是有效的備份。請確認完整貼上。"; }
  }
});
document.addEventListener("submit", function(e){
  e.preventDefault();
  if(e.target.id === "f-auth") submitAuth(e.target, e.submitter && e.submitter.value === "signup");
  else if(e.target.id === "f-add") submitAdd();
  else if(e.target.id === "f-read") submitRead(e.target.getAttribute("data-id"));
});
document.addEventListener("input", function(e){
  if(e.target.id === "add-url") parseUrlField();
  else if(e.target.id === "add-title" && pendingAdd) pendingAdd.autoTitle = undefined;
});
document.addEventListener("change", function(e){
  if(!pendingAdd || e.target.form !== pendingAdd.form) return;
  if(e.target.id === "add-pdf") selectPdf(pendingAdd, e.target);
  else if(e.target.name === "size"){
    pendingAdd.manualSize = true;
    pendingAdd.autoSize = false;
    pendingAdd.form.querySelector("#add-size-label").textContent = "篇幅";
  }
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !sheetEl.hidden) closeSheet(); });
window.addEventListener("hashchange", function(){
  if(readerPage && readerPage.hash !== location.hash) flushReaderProgress();
  render();
});
function updateReaderTheme(){if(tab() === "reader") render();}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateReaderTheme);
new MutationObserver(updateReaderTheme).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
document.addEventListener("visibilitychange", function(){
  if(document.hidden) flushReaderProgress(true);
  else{
    if(sync) sync.keepalive = false;
    refreshSync();
  }
});
window.addEventListener("pagehide", function(){flushReaderProgress(true);});
window.addEventListener("focus", function(){if(sync) refreshSync();});
window.addEventListener("online", function(){if(sync) refreshSync();});
window.addEventListener("offline", renderHead);

/* ---------- boot ---------- */
(function(){
  var cache = readLocal();
  if(cache && cache.started && Array.isArray(cache.items)){
    state = cache;
    var account = readSync();
    settle(function(it){
      if(!account || !it.pdf) return;
      if(!bootExpiredPdfs) bootExpiredPdfs = {userId:account.userId, ids:[]};
      bootExpiredPdfs.ids.push(it.id);
    });
  }
  else { state = demoState(); demo = true; }
  initSupabase();
  render();
})();
</script>
